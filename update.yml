name: Perbarui atribusi AI deforestasi
on:
  schedule:
    - cron: "0 */6 * * *"     # setiap 6 jam
  workflow_dispatch:           # bisa dijalankan manual dari tab Actions
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline_deforestasi_ai.py
      - name: Commit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Perbarui atribusi AI deforestasi otomatis"
          git push
